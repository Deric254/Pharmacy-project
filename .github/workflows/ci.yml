name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-quality-gate:
    name: Backend lint, type-check, tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: ruff format --check .

      - name: Type check (mypy)
        working-directory: backend
        run: mypy app scripts desktop_main.py

      - name: Run migrations against a fresh SQLite DB
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration-check.db
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: alembic upgrade head

      - name: Verify migrations also downgrade cleanly
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migration-check.db
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: alembic downgrade base

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          REDIS_URL: redis://127.0.0.1:6379/0
          JWT_SECRET_KEY: ci-test-secret-not-for-production
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-quality-gate:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  electron-gui-smoke-test:
    name: Electron GUI smoke test (real window, real backend)
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-quality-gate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install electron test dependencies
        working-directory: electron
        run: npm install

      - name: Install Chromium/Electron system dependencies
        working-directory: electron
        run: npx playwright install-deps chromium

      - name: Run the real Electron GUI test
        working-directory: electron
        # Electron needs *a* display to open a real window even when
        # nobody is physically watching -- Xvfb is a real, if virtual,
        # display server, not a mock. This actually launches the real
        # app (main.js spawning the real Python backend) and asserts
        # on the real rendered window: never a headless approximation.
        run: xvfb-run -a npm run test:e2e

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-gui-test-failure-diagnostics
          path: electron/test-results/
          retention-days: 7
