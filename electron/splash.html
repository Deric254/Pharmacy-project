<!doctype html>
<!--
  Splash screen shown the instant the app launches, before the backend
  has even been spawned. Purely presentational: no scripts, no fetch,
  no IPC -- it has nothing to do but sit on screen until main.js closes
  it once the real window is ready to show. Kept fully self-contained
  (inline CSS, one local image) so it can never itself fail to load or
  add any delay to startup.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pharmacy ERP</title>
    <style>
      /* Matches BrowserWindow's own backgroundColor (#f7f3ec) and the
         app's "paper" theme token, so there is no color flash when the
         real window takes over from this one. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f7f3ec;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
      }

      .splash {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        -webkit-user-select: none;
        user-select: none;
      }

      .logo {
        width: 88px;
        height: 88px;
        object-fit: contain;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(31, 41, 51, 0.15);
        border-top-color: #b08d57; /* matches the app's "brass" accent */
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .label {
        font-size: 14px;
        color: #6b6255; /* matches the app's "ink-soft" token */
        letter-spacing: 0.01em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="logo" src="build/logo.png" alt="" onerror="this.style.display='none'" />
      <div class="spinner"></div>
      <div class="label">Starting Pharmacy ERP&hellip;</div>
    </div>
  </body>
</html>
