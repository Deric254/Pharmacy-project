name: Release

# Runs only after CI has passed on main (workflow_run), so a release can
# NEVER be cut from code that failed lint/type-check/tests.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release==9.*

      - name: Determine and apply version bump
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BEFORE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          # Conventional Commits first -- fix:/feat:/BREAKING CHANGE:
          # still get correctly-sized patch/minor/major bumps exactly
          # as before, for anyone who does write them that way.
          semantic-release version

          AFTER_NORMAL_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")

          # But every push should produce a real, downloadable release
          # -- not require remembering a specific commit message
          # prefix. If nothing matched the Conventional Commits format
          # (the common case for a plain "fixed stuff" message), force
          # a patch bump instead of silently doing nothing.
          if [ "$BEFORE_TAG" = "$AFTER_NORMAL_TAG" ]; then
            semantic-release version --patch
          fi

          semantic-release publish
          echo "BEFORE_TAG=$BEFORE_TAG" >> "$GITHUB_ENV"

      # python-semantic-release's raw CLI (as opposed to its GitHub
      # Action wrapper) doesn't expose a "did anything actually get
      # released" output on its own -- when there are no
      # release-worthy commits since the last tag, `version`/`publish`
      # are harmless no-ops that leave the repo exactly as it was. The
      # Windows executable build below only makes sense (and only has
      # something to attach itself to) when a real release happened,
      # so detect that the simple, dependable way: did the latest tag
      # actually change.
      - name: Detect whether a release was actually cut
        id: detect
        run: |
          AFTER_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE_TAG" != "$AFTER_TAG" ] && [ "$AFTER_TAG" != "none" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # Version bump reads Conventional Commits from the messages since
      # the last tag, when they're written that way:
      #   fix:        -> PATCH  (1.2.3 -> 1.2.4)
      #   feat:       -> MINOR  (1.2.3 -> 1.3.0)
      #   feat!: / BREAKING CHANGE: -> MAJOR (1.2.3 -> 2.0.0)
      # Every push still cuts a release either way -- if nothing
      # matched that format, the step above forces a patch bump
      # instead of silently doing nothing. Deliberate tradeoff: a
      # purely cosmetic commit still bumps the version, in exchange
      # for never having to remember a specific prefix to get a real,
      # downloadable release out of a push.

  build-windows-exe:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the executable
        run: pyinstaller pyinstaller/pharmacy-erp.spec --distpath dist --noconfirm

      - name: Smoke-test the built exe actually starts and serves
        shell: bash
        run: |
          # A successful PyInstaller build proves the bundling worked,
          # not that the resulting exe actually runs -- an import
          # missed by hiddenimports, a bundled data file in the wrong
          # place, anything like that would still "build" fine and
          # then fail the instant someone double-clicks it. Actually
          # running it here, then driving the real HTTP setup flow the
          # web UI itself uses (not a console prompt -- desktop_main.py
          # no longer has one, since Electron launches it with no
          # console at all), is what catches that before it ships.
          # LOCALAPPDATA specifically -- see desktop_main.py's
          # _app_data_dir(), which reads that exact variable.
          export LOCALAPPDATA="$RUNNER_TEMP/exe-smoke-test"
          mkdir -p "$LOCALAPPDATA"
          "./dist/Pharmacy-ERP.exe" &
          EXE_PID=$!

          ready=""
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health 2>/dev/null | grep -q 200; then
              ready="yes"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::Built exe never answered /health after 30s -- failing the release rather than shipping a broken asset."
            kill "$EXE_PID" 2>/dev/null || true
            exit 1
          fi

          echo "Exe is up. Driving the real setup flow, then verifying login works end-to-end..."
          setup_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/api/v1/setup/first-user \
            -H "Content-Type: application/json" \
            -d '{"full_name":"CI Smoke Test","username":"smoketest","password":"SmokeTestPass123"}')
          if [ "$setup_status" != "204" ]; then
            echo "::error::Setup smoke test got HTTP $setup_status from /setup/first-user, expected 204 -- failing the release rather than shipping a broken asset."
            kill "$EXE_PID" 2>/dev/null || true
            exit 1
          fi

          login_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"smoketest","password":"SmokeTestPass123"}')
          kill "$EXE_PID" 2>/dev/null || true

          if [ "$login_status" != "200" ]; then
            echo "::error::Login smoke test got HTTP $login_status, expected 200 -- failing the release rather than shipping a broken asset."
            exit 1
          fi
          echo "Smoke test passed: the exe migrates, the real setup endpoint creates the first user, and login works."

      - name: Build the Electron desktop installer
        working-directory: electron
        shell: bash
        run: |
          # Real version, not the hardcoded placeholder in package.json --
          # otherwise every release would ship an installer claiming to be
          # v0.1.0 regardless of what it actually is.
          npm version "${{ needs.release.outputs.tag }}" --no-git-tag-version --allow-same-version
          npm install
          npm run build:win

      - name: Rename with the version
        shell: bash
        run: |
          mv "dist/Pharmacy-ERP.exe" "dist/Pharmacy-ERP-${{ needs.release.outputs.tag }}.exe"
          # electron-builder's own default NSIS naming
          # ("<productName> Setup <version>.exe") -- found by its
          # actual glob rather than hardcoded, since that pattern can
          # shift between electron-builder versions.
          installer_path=$(find electron/dist -maxdepth 1 -name "*.exe" | head -n 1)
          if [ -z "$installer_path" ]; then
            echo "::error::No installer .exe found under electron/dist after the Electron build."
            exit 1
          fi
          mv "$installer_path" "dist/Pharmacy-ERP-Setup-${{ needs.release.outputs.tag }}.exe"

      - name: Attach the executables to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ needs.release.outputs.tag }}" \
            "dist/Pharmacy-ERP-${{ needs.release.outputs.tag }}.exe" \
            "dist/Pharmacy-ERP-Setup-${{ needs.release.outputs.tag }}.exe" --clobber
