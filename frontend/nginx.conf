server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API and WebSocket calls go to the backend container. The
    # frontend's fetch calls use relative paths (/api/v1/...) on
    # purpose, so this proxy is what makes "same origin" true in
    # production the same way Vite's dev server proxy does locally.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Never cache the service worker or manifest -- a stale cached
    # service worker can pin a device to an old build indefinitely.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # SPA client-side routing: any path that isn't a real file falls
    # back to index.html so React Router (not nginx) handles it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
